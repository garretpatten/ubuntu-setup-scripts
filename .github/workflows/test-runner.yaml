name: 'Test Runner'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Cancel superseded pull-request runs on the same branch/ref.
  group: test-runner-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 'Unit Tests (bats)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup bats
        id: setup-bats
        # bats-core/bats-action 4.1.0
        # yamllint disable-line rule:line-length
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e
        with:
          bats-version: '1.14.0'
          detik-install: false
          github-token: ${{ github.token }}

      - name: ShellCheck tests
        # The shared quality gate only lints changed *.sh/*.bash/*.zsh files,
        # so cover the extensionless stubs and *.bats files here.
        # Fixtures are excluded; some are intentionally ShellCheck-dirty.
        run: |
          find tests -type f \( -name '*.bats' -o -name '*.bash' \
            -o -name '*.sh' -o -path 'tests/stubs/*' \) \
            ! -path 'tests/fixtures/*' -print0 |
            xargs -0 shellcheck -x

      - name: Run bats
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats --recursive tests/

  test-cli:
    name: 'CLI-only install'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      # Noble's apt tealdeer (1.6.x) still fetches from the removed tldr.sh URL;
      # 1.8+ uses GitHub releases.
      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      - name: Run CLI-only install
        run: |
          cd src/scripts
          bash run-install.sh cli

      - name: Validate CLI installs
        run: ./scripts/validate-installs-cli.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-cli
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3

  test-config:
    name: 'Configuration run'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run configuration
        run: |
          cd src/scripts
          bash run-config.sh

      - name: Validate config-only outcomes
        run: ./scripts/validate-config-only.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-config
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3

  test-full:
    name: 'Full install'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      - name: Run full install
        run: |
          cd src/scripts
          bash run-install.sh all

      - name: Validate full installs
        run: ./scripts/validate-installs.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-full
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3

  test-master:
    name: 'Master (install + config)'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      # CI: no GNOME session; gnome-gsettings.sh exits early.
      - name: Run setup scripts
        run: |
          cd src/scripts
          bash master.sh

      - name: Validate installs and config
        run: ./scripts/validate.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-master
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3
