name: 'Test Runner'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Cancel superseded pull-request runs on the same branch/ref.
  group: test-runner-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  test-cli:
    name: 'CLI-only install'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      # Noble's apt tealdeer (1.6.x) still fetches from the removed tldr.sh URL;
      # 1.8+ uses GitHub releases.
      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      - name: Run CLI-only install
        run: |
          cd src/scripts
          bash run-install.sh cli

      - name: Validate CLI installs
        run: ./scripts/validate-installs-cli.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-cli
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3

  test-config:
    name: 'Configuration run'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run configuration
        run: |
          cd src/scripts
          bash run-config.sh

      - name: Validate config-only outcomes
        run: ./scripts/validate-config-only.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-config
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3

  test-full:
    name: 'Full install'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      - name: Run full install
        run: |
          cd src/scripts
          bash run-install.sh all

      - name: Validate full installs
        run: ./scripts/validate-installs.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-full
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3

  test-master:
    name: 'Master (install + config)'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      # CI: no GNOME session; gnome-gsettings.sh exits early.
      - name: Run setup scripts
        run: |
          cd src/scripts
          bash master.sh

      - name: Validate installs and config
        run: ./scripts/validate.sh

      - name: Upload per-script install logs
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-logs-master
          path: /tmp/ubuntu-setup-*/logs/
          if-no-files-found: ignore
          retention-days: 3
