name: 'Test Runner'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: 'Test Ubuntu Setup Scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: find src/scripts -name '*.sh' -exec chmod +x {} +

      # Noble's apt tealdeer (1.6.x) still fetches from the removed tldr.sh URL; 1.8+ uses GitHub releases.
      - name: Upgrade tealdeer for CI
        run: |
          curl -fsSL -o /usr/local/bin/tldr \
            https://github.com/tealdeer-rs/tealdeer/releases/download/v1.8.1/tealdeer-linux-x86_64-musl
          chmod +x /usr/local/bin/tldr
          tldr --version

      # CI: no GNOME session; gnome-gsettings.sh exits early.
      - name: Run setup scripts
        run: |
          cd src/scripts
          bash master.sh

      - name: Validate installs and config
        run: chmod +x scripts/validate.sh && ./scripts/validate.sh
