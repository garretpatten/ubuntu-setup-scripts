version: 2
updates:
  # Keep third-party action pins fresh. Version updates are intentionally
  # scoped to GitHub Actions. Dependabot must not open PRs automatically,
  # so updates are disabled here and bumps are done manually.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'build'
      include: 'scope'
